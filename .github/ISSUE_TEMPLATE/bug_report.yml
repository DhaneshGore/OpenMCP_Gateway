name: Bug report
description: Something does not work as documented
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security vulnerabilities must not be reported here**. See SECURITY.md.
        Please remove tokens, hashes and other secrets from anything you paste.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Config: ...
        2. Run: openmcp ...
        3. Client calls ...
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration (secrets removed)
      render: yaml
  - type: textarea
    id: doctor
    attributes:
      label: Output of `openmcp --version` and `openmcp doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: text
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Python version, Docker?, MCP client and version"
